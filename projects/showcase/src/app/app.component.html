<div class="layout" [class.sidebar-closed]="!sidebarOpen">
  <!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="header-content">

    </div>
    <button
      type="button"
      class="sidebar-toggle sidebar-toggle--close"
      (click)="toggleSidebar()"
    >
      ✕
    </button>
  </div>
  <div>      <h2>{{ title }}</h2></div>
    <ul>
      <li
        *ngFor="let section of sections"
        [class.active]="section.id === currentSection"
      >
        <button type="button" (click)="goToSection(section.id)">
          {{ section.label }}
        </button>
      </li>
    </ul>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <section
  class="content"
  [ngClass]="{ 'content--portada': currentSection === 'portada' }"
  >

    <!-- Botón para abrir sidebar cuando esté cerrado -->
    <button
      type="button"
      class="sidebar-toggle sidebar-toggle--open"
      *ngIf="!sidebarOpen"
      (click)="toggleSidebar()"
    >
      ☰ Menú
    </button>

  <ng-container [ngSwitch]="currentSection">
    <!-- PORTADA -->
    <div *ngSwitchCase="'portada'" class="section portada">
      <app-portada></app-portada>
    </div>

    <!-- ÍNDICE -->
    <div *ngSwitchCase="'indice'" class="section section--indice">
      <h1>Índice</h1>
      <ol>
        <ng-container *ngFor="let s of sections">
          <li *ngIf="s.id !== 'indice'">
            <a (click)="goToSection(s.id)">{{ s.label }}</a>
          </li>
        </ng-container>
      </ol>
    </div>

    <!-- INTRODUCCIÓN -->
    <div *ngSwitchCase="'introduccion'" class="section">
      <app-introduccion></app-introduccion>
    </div>

    <!-- REQUISITOS DEL SISTEMA -->
    <div *ngSwitchCase="'requisitos'" class="section">
      <app-requisitos></app-requisitos>
    </div>

    <!-- INSTALACIÓN / ACCESO -->
    <div *ngSwitchCase="'instalacion'" class="section">
      <app-instalacion></app-instalacion>
    </div>

    <!-- DESCRIPCIÓN DE LA INTERFAZ -->
    <div *ngSwitchCase="'interfaz'" class="section">
      <nav>
        <h1>Descripción de la interfaz</h1>
        <p class="section-subtitle">
          Panel principal, menús de navegación y botones de acción rápida de la app.
        </p>
        <button class="ngx-tourguide--button" (click)="startInterfazTour()">
          Recorrido guiado por la interfaz
        </button>
      </nav>

      <main>
        <app-descripcion class="section"></app-descripcion>
      </main>
    </div>



    <!-- FUNCIONES Y CARACTERÍSTICAS -->
    <div *ngSwitchCase="'funciones'" class="section">
      <nav class="section-header">
        <h1>Funciones principales</h1>
        <button class="tour-start-btn" (click)="startFuncionesTour()">
          Tomar un recorrido guiado
        </button>
      </nav>

      <main>
        <showcase-setup class="section"></showcase-setup>
      </main>
    </div>

    <!-- FAQ -->
    <div *ngSwitchCase="'faq'" class="section">
      <app-solucion></app-solucion>
    </div>

    <!-- MANTENIMIENTO -->
    <div *ngSwitchCase="'mantenimiento'" class="section">
      <app-mantenimiento></app-mantenimiento>
    </div>

    <!-- SOPORTE -->
    <div *ngSwitchCase="'soporte'" class="section">
      <app-soporte></app-soporte>
    </div>

    <!-- GLOSARIO -->
    <div *ngSwitchCase="'glosario'" class="section">
      <app-glosario></app-glosario>
    </div>

    <!-- APÉNDICES -->
    <div *ngSwitchCase="'apendices'" class="section">
      <app-apendice></app-apendice>
    </div>

    <!-- FALLBACK -->
    <div *ngSwitchDefault class="section">
      <p>Selecciona una sección en el menú de la izquierda.</p>
    </div>
  </ng-container>

  </section>
</div>

<!-- Componente del tour -->
<shipbit-ngx-tour-guide>
  <button
    class="ngx-tourguide--button"
    ngxTourGuidePreviousContent
    (click)="tourGuideService.executeAction('previousStop')"
  >
    <span class="material-icons md-18">arrow_back</span>
  </button>
  <button
    class="ngx-tourguide--button"
    ngxTourGuideNextContent
    (click)="tourGuideService.executeAction('nextStop')"
  >
    <span class="material-icons md-18">arrow_forward</span>
  </button>
  <button
    class="ngx-tourguide--button"
    ngxTourGuideFinishContent
    (click)="tourGuideService.executeAction('finishTour')"
  >
    <span class="material-icons md-18">check</span>
  </button>
  <button
    class="ngx-tourguide--button"
    ngxTourGuideSkipContent
    (click)="tourGuideService.executeAction('skipTour')"
  >
    <span class="material-icons md-18">close</span>
  </button>
</shipbit-ngx-tour-guide>
